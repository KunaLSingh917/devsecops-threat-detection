apiVersion: apps/v1
kind: Deployment
metadata:
  name: devsecops-app
  namespace: devsecops

spec:
  replicas: 2

  selector:
    matchLabels:
      app: devsecops-app

  template:
    metadata:
      labels:
        app: devsecops-app

    spec:
      containers:
      - name: app
        image: kunalsingh7/devsecops-threat-detection:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000

